    date: '2026-08-31'
    http_status: 401
    content_type: application/json
    body: '{"error":"Unauthorized. Please provide a valid X-API-Key header."}'
  note: >-
    Not RFC 9457 — the response is application/json, not application/problem+json, and
    carries no type/title/status/detail/instance members. An agent has to match on

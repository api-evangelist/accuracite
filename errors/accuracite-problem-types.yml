problem_types:
- status: 400
  title: Invalid request body
  cause: >-
    Missing or invalid `text` or `texts`, both fields provided at once, or a non-string
    item inside `texts`.
  remediation: Send exactly one of `text` (string) or `texts` (array of strings).
  endpoints: [POST /api/v1/verify]
- status: 401
  title: Unauthorized
  cause: Missing or invalid X-API-Key header.
  remediation: Send a valid key in X-API-Key.
  endpoints: [POST /api/v1/verify, POST /api/v1/generate]
  verified: probed 2026-08-31
- status: 403
  title: Plan does not include API access
  cause: The key is valid but the account is not on a plan that includes the REST API.
  remediation: Upgrade to Pro or Bulk Verification.
  endpoints: [POST /api/v1/verify, POST /api/v1/generate]
- status: 413
  title: Payload too large
  cause: A citation exceeds 2,000 characters, or `texts` exceeds 10 items.
  remediation: Split the batch into chunks of 10 or fewer, each citation under 2,000 characters.
  endpoints: [POST /api/v1/verify]
- status: 429
  title: Rate limit or credit limit reached
  cause: >-
    Either the per-minute rate limit (60/min verify, 30/min generate) or an exhausted
    credit balance. For a `texts` batch this rejects the WHOLE batch, and nothing is
    charged or processed.
  remediation: >-
    Back off and retry for the rate-limit case; top up the plan for the credit case. The
    API does not distinguish the two, and returns no Retry-After header.
  endpoints: [POST /api/v1/verify, POST /api/v1/generate]
gaps:
- No error codes or type URIs — only HTTP status plus a prose message.
- 429 conflates rate limiting with credit exhaustion, which need opposite client behaviour.
- No Retry-After on 429.
- No 5xx behaviour documented.

    a local stdio server run with npx -y accuracite-mcp and ACCURACITE_API_KEY; its published source registers exactly two tools: verify_citation
    (text, 1-2000 chars -> POST /api/v1/verify) and find_citations (claim, 1-5000 chars; limit 1-10 -> POST /api/v1/generate); no batch tool.
    Smithery listing https://smithery.ai/servers/accuracite/accuracite-mcp is 200 and names both tools; https://accuracite.com/api-docs has an

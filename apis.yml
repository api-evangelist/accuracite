apis:
- name: AccuraCite API
  description: 'Synchronous REST API for citation verification and claim-to-source lookup. Two operations, both POST and both keyed by an X-API-Key
    header: /api/v1/verify checks a citation string (or a bare URL, or a batch of up to 10) against eight academic indexes and returns verified
    / mismatch / not_found with the matched record, and /api/v1/generate returns real papers whose abstracts support a supplied claim. Documented
    rate limits are 60/min verify and 30/min generate, metered from a shared credit pool (1 credit per verify, 4 per generated citation); API
    access is available on all plans. OpenAPI spec is published at https://accuracite.com/openapi.json. /openapi.json, /openapi.yaml, /swagger.json,
    /api/v1/openapi.json, /api-docs.json, /redoc and /apis.json all returned 404 on 2026-08-31, as did every /.well-known/ path -- so the API
    reference at /api-docs is the only contract. Originally PARKED by the apis.io gate as low confidence, which was a false negative: accuracite.com
    serves a 4KB llms.txt naming the docs page and both endpoints explicitly.'

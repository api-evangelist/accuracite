aid: accuracite
name: AccuraCite
type: Index
kind: company
visibility: Public
description: >-
  AccuraCite verifies bibliographies and finds real citations, catching AI-hallucinated references before they
  are published. Every citation supplied as raw text, BibTeX, RIS or an uploaded PDF is checked against eight
  academic indexes -- OpenAlex, Crossref, Semantic Scholar, PubMed, DBLP, arXiv, CORE and Google Scholar --
  and returned as verified, mismatch or not_found, with the matched bibliographic record and a field-level
  list of what disagreed. A second surface runs the other direction: given a claim, it returns real papers
  whose abstracts actually support it rather than papers whose titles merely look related. Both are exposed
  over a small synchronous REST API (POST /api/v1/verify and POST /api/v1/generate) keyed by an X-API-Key
  header and metered from a shared monthly credit pool. AccuraCite is a solo-founder product built by a
  computer-science PhD after finding fabricated citations in a co-authored, partly AI-drafted paper.

note: >-
  AccuraCite ships NO MCP server. Searched the site, the sitemap, npm, PyPI and GitHub
  on 2026-08-31 and found none; https://accuracite.com/mcp returns 404 and
  mcp.accuracite.com does not resolve. The tools below are a CANDIDATE derivation from
  the two published REST endpoints — nobody serves them. This is a notable gap given the
  provider wrote a full blog post about MCP citation verification
  (https://accuracite.com/blog/why-mcp-tool-calling-doesnt-fix-citation-hallucination),
  where they describe a consensus-checking MCP server as "a legitimate way to bring
  real-time fact-checking into a chat or editor workflow" — an argument for exposing
  exactly this product as one, which they have not yet done.

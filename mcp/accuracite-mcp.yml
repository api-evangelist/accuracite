candidate_tools:
- name: verify_citation
  description: >-
    Verify a single citation string (or a bare URL) against eight academic indexes and
    return verified / mismatch / not_found with the matched bibliographic record.
  backing_operation: POST /api/v1/verify
  input_schema_source: https://accuracite.com/api-docs
  inputs:
  - name: text
    type: string
    required: true
    constraint: under 2000 characters
  consequence: read-only; deducts 1 credit per successful call
- name: verify_citations_batch
  description: Verify up to 10 citation strings in one parallel call.
  backing_operation: POST /api/v1/verify
  inputs:
  - name: texts
    type: 'string[]'
    required: true
    constraint: max 10 items, each under 2000 characters
  consequence: >-
    read-only; all-or-nothing credit claim for the whole batch — rejected with 429 if
    the balance cannot cover every item
- name: find_sources_for_claim
  description: >-
    Find real papers whose abstracts actually support a supplied claim, rather than
    papers whose titles merely look related.
  backing_operation: POST /api/v1/generate
  inputs:
  - name: text
    type: string
    required: true
  - name: limit
    type: integer
    required: false
    default: 1
    constraint: 1-10
  consequence: read-only; deducts 4 credits per citation returned, shortfall auto-refunded
authentication:
  scheme: X-API-Key header
  plan_required: Pro or Bulk Verification
  see: authentication/accuracite-authentication.yml
